<!DOCTYPE html>
<html lang="vi" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiến độ — Film Shadowing</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="appbar"></div>
<main class="wrap section">
  <h1>Tiến độ học</h1>
  <div id="summary" class="grid-lessons" style="margin-bottom:22px"></div>
  <div class="card" style="margin-bottom:18px">
    <div class="card__head"><h2 style="font-size:1rem">Câu cần luyện lại</h2>
      <span class="hint" style="margin-left:auto">Xếp theo điểm thấp nhất</span></div>
    <div class="card__body card__body--flush" id="weakLines"></div>
  </div>
  <div class="card">
    <div class="card__head"><h2 style="font-size:1rem">Dữ liệu của bạn</h2></div>
    <div class="card__body stack stack--sm">
      <p class="hint" style="margin:0">Tiến độ nằm trên máy này, không gửi đi đâu. Muốn giáo viên xem thì xuất tệp rồi gửi.</p>
      <div class="btn-row">
        <button class="btn btn--sm btn--primary" id="btnExport">⬇ Xuất tiến độ</button>
        <label class="btn btn--sm" style="margin:0;font-weight:600">Nhập tiến độ
          <input type="file" id="inImport" accept="application/json" hidden></label>
        <button class="btn btn--sm" id="btnReset">Xoá hết và bắt đầu lại</button>
      </div>
    </div>
  </div>
</main>
<script type="module" src="assets/js/pages/progress.js"></script>
</body>
</html>
